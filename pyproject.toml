[project]
name = "will-training"
version = "1.0.0"
description = "Daily football training app for Will (age 9)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["training/tests"]
addopts = "-q"
